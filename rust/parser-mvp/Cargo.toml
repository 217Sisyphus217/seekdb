[package]
name = "parser-mvp"
version = "0.1.0"
edition = "2021"
publish = false

# An isolated experiment; it is not linked into the database.
[workspace]

[dependencies]
pest = "=2.9.5"
pest_meta = "=2.9.5"
pest_vm = "=2.9.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = true
