[package]
name = "parser-mvp"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone CLI; the optional server feature exposes the integration experiment.
[workspace]

[features]
server = ["dep:cxx", "dep:stacker"]

[dependencies]
cxx = { version = "=1.0.202", optional = true }
stacker = { version = "=0.1.25", optional = true }
peg = "=0.8.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = true
